name: Go CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Check compatibility evidence failure handling
        run: python3 scripts/compatibility_evidence_test.py -v
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v -coverprofile=coverage.out ./...

      - name: Check Coverage
        run: |
          go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}' | awk '{if ($1 < 40.0) { print "Coverage is " $1 "%, which is below the 40% threshold"; exit 1 } else { print "Coverage is " $1 "%" }}'

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  compatibility:
    name: Go 1.24 Source Compatibility
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true
      - name: Compile minimum-language packages and examples
        run: go test -run '^$' ./...

  race:
    name: Signing and Contract Race Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race-check protocol boundaries
        run: go test -race -count=1 ./pkg/auth/... ./pkg/clob/... ./pkg/relayer ./pkg/gamma ./pkg/data ./pkg/combos ./pkg/bridge ./pkg/positions ./pkg/transport
