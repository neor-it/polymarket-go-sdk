name: Compatibility Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Build Compatibility Evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Generate compatibility evidence
        run: ./scripts/compatibility-evidence.sh --out-dir artifacts/compatibility
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-evidence-${{ github.run_id }}
          path: artifacts/compatibility
          if-no-files-found: error
